org.gradle.jvmargs=-Xmx2048m
# Build with JDK 17 (matches compileOptions below) — AGP's bundled lint
# tooling is unreliable on newer JDKs. Set JAVA_HOME=<jdk17 path> before
# invoking gradlew, or configure your IDE's Gradle JVM to JDK 17. Not pinned
# here via org.gradle.java.home since that path is machine-specific and
# would break CI / other developers' setups.
android.useAndroidX=true
android.enableJetifier=false
# AGP 8.6.0 was only tested up to compileSdk 35; suppress the warning until
# we upgrade AGP to a version that officially supports compileSdk 36.
android.suppressUnsupportedCompileSdk=36
