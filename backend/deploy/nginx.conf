# Include these locations INSIDE your existing HTTPS server {} block.
# Keep your existing domain/certificate configuration. This is not a full server.
# If using an upstream CDN, configure trusted real_ip ranges separately.
location /api/ {
    client_max_body_size 17m;
    client_body_timeout 20s;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    error_page 413 = @trust_signal_too_large;
}

location = /health {
    proxy_pass http://127.0.0.1:8002;
}

location @trust_signal_too_large {
    default_type application/json;
    return 413 '{"detail":"Yuborilgan ma’lumot juda katta."}';
}
